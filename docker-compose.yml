name: LinkLian-Infra

services:
  linklian-redis:
    image: redis:7-alpine
    container_name: linklian-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6
    networks:
      - linklian-net

  linklian-upstash-redis:
    image: hiett/serverless-redis-http:latest
    container_name: linklian-upstash-redis
    ports:
      - "4001:8080"
    environment:
      SRH_MODE: env
      SRH_TOKEN: 12345678
      SRH_CONNECTION_STRING: redis://linklian-redis:6379
      SRH_PORT: 8080
    depends_on:
      linklian-redis:
        condition: service_healthy
    networks:
      - linklian-net

volumes:
  redis-data:
    driver: local

networks:
  linklian-net:
    external: true